<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Converter</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 25px 16px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 30px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    input[type="file"] {
      width: 100%;
      padding: 15px;
      border: 2px dashed #bbb;
      border-radius: 12px;
      background: #fafafa;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #2563eb;
      color: white;
      margin-top: 10px;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #preview {
      margin-top: 20px;
    }

    .preview-img {
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      border-radius: 10px;
      margin-top: 10px;
      border: 1px solid #ddd;
    }

    .success {
      margin-top: 15px;
      color: #16803c;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>📄 PDF Converter</h1>

      <p class="subtitle">
        Convert your images into a PDF easily
      </p>

      <input
        type="file"
        id="imageInput"
        accept="image/*"
        multiple
      >

      <div id="preview"></div>

      <button id="convertBtn" disabled>
        Convert Images to PDF
      </button>

      <div id="message"></div>

    </div>
  </div>

  <script>
    const imageInput = document.getElementById("imageInput");
    const convertBtn = document.getElementById("convertBtn");
    const preview = document.getElementById("preview");
    const message = document.getElementById("message");

    let selectedImages = [];

    imageInput.addEventListener("change", function () {

      selectedImages = Array.from(this.files);

      preview.innerHTML = "";
      message.innerHTML = "";

      if (selectedImages.length === 0) {
        convertBtn.disabled = true;
        return;
      }

      selectedImages.forEach(file => {

        const reader = new FileReader();

        reader.onload = function(e) {

          const img = document.createElement("img");

          img.src = e.target.result;
          img.className = "preview-img";

          preview.appendChild(img);
        };

        reader.readAsDataURL(file);

      });

      convertBtn.disabled = false;
    });


    convertBtn.addEventListener("click", async function () {

      if (selectedImages.length === 0) return;

      convertBtn.disabled = true;
      convertBtn.textContent = "Creating PDF...";

      const { jsPDF } = window.jspdf;

      const pdf = new jsPDF();

      for (let i = 0; i < selectedImages.length; i++) {

        const file = selectedImages[i];

        const imageData = await readFile(file);

        const img = new Image();

        img.src = imageData;

        await new Promise(resolve => {
          img.onload = resolve;
        });

        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();

        const margin = 10;

        const availableWidth = pageWidth - margin * 2;
        const availableHeight = pageHeight - margin * 2;

        let width = img.width;
        let height = img.height;

        const ratio = Math.min(
          availableWidth / width,
          availableHeight / height
        );

        width = width * ratio;
        height = height * ratio;

        const x = (pageWidth - width) / 2;
        const y = (pageHeight - height) / 2;

        if (i > 0) {
          pdf.addPage();
        }

        pdf.addImage(
          imageData,
          "JPEG",
          x,
          y,
          width,
          height
        );
      }

      pdf.save("converted-images.pdf");

      convertBtn.disabled = false;
      convertBtn.textContent = "Convert Images to PDF";

      message.innerHTML =
        '<div class="success">✅ PDF created successfully!</div>';
    });


    function readFile(file) {

      return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;

        reader.readAsDataURL(file);
      });
    }
  </script>

</body>
</html>
